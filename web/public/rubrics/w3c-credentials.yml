# Evaluated against crJSON plus `identityCredentials` (web/src/rubrics/run.ts): the W3C verifiable
# credentials behind the active manifest's CAWG identity assertions, as c2pa-rs decoded them into the
# manifest store. crJSON alone keeps only their issuer and validity dates. Each entry is
# { manifest, active, label, sigType, credential }. For identity claims aggregation, c2pa-rs flattens
# credentialSubject into top-level verifiedIdentities and c2paAsset.
rubric_metadata:
  name: W3C Verifiable Credentials Rubric
  issuer: CAWG Viewer
  date: '2026-11-09T00:00:00Z'
  version: '0.1'
  language: en
variables:
  $vc_base_context: https://www.w3.org/ns/credentials/v2
  # The credential type and @context entry CAWG requires, per sig_type.
  $ica_type: IdentityClaimsAggregationCredential
  $ica_context: https://cawg.io/identity/1.1/ica/context/
  $vcb_type: C2PABindingCredential
  $vcb_context: https://cawg.io/identity/1.2/vcb/context/
expressions:
  # Credentials from the active manifest's identity assertions.
  _credentials: (identityCredentials || `[]`)[? active]
  # An absolute URL or URI (has a scheme).
  _isUrl: type($args[0]) == "string" && length(split($args[0], ":")) > 1 && length(split($args[0], ":")[0]) > 0
  # XML Schema dateTimeStamp: a date, a time and a time zone (Z or ±hh:mm).
  _isDateTimeStamp: >-
    type($args[0]) == "string" && length(split($args[0], "T")) == 2 && toDate($args[0]) != null &&
    (endsWith($args[0], "Z") || endsWith($args[0], "z") || contains(["+", "-"], mid($args[0], length($args[0]) - 6, 1)))
  _verifiedIdentities: notNull($args[0].verifiedIdentities, `[]`)
  # Whether credential $args[0] has type $args[1] and @context entry $args[2].
  _hasProfile: contains(toArray(notNull($args[0].type, `[]`)), $args[1]) && contains(toArray(notNull($args[0].'@context', `[]`)), $args[2])

---

- id: vc:credentials_present
  description: Check whether the active manifest has an identity assertion backed by a W3C verifiable credential
  specSection: CAWG Identity 1.1/1.2 §8.1; Identity 1.3-draft §8.3
  warnIfMatched: true
  expression: |
    if(length(_credentials()) == 0, ["no verifiable credential"], [])
  reportText:
    'true':
      en: The active manifest has an identity assertion backed by a W3C verifiable credential
    'false':
      en: The active manifest has no identity assertion backed by a W3C verifiable credential (X.509 identities have none)

- id: vc:context
  description: '@context is present and its first item is https://www.w3.org/ns/credentials/v2'
  specSection: VC Data Model 2.0 §4.3
  failIfMatched: true
  expression: |
    _credentials()[? toArray(notNull(credential.'@context', `[]`))[0] != $vc_base_context].label
  reportText:
    'true':
      en: Every credential's @context starts with the VC 2.0 base context
    'false':
      en: 'Credentials whose @context does not start with https://www.w3.org/ns/credentials/v2: {{matches}}'

- id: vc:id
  description: id, when present, is a single URL
  specSection: VC Data Model 2.0 §4.4
  failIfMatched: true
  expression: |
    _credentials()[? credential.id != null && !_isUrl(credential.id)].label
  reportText:
    'true':
      en: Every credential id is a URL (or absent)
    'false':
      en: 'Credentials with an id that is not a URL: {{matches}}'

- id: vc:type
  description: type is present and includes VerifiableCredential
  specSection: VC Data Model 2.0 §4.5
  failIfMatched: true
  expression: |
    _credentials()[? !contains(toArray(notNull(credential.type, `[]`)), "VerifiableCredential")].label
  reportText:
    'true':
      en: Every credential's type includes VerifiableCredential
    'false':
      en: 'Credentials whose type does not include VerifiableCredential: {{matches}}'

- id: vc:issuer
  description: issuer is a URL, or an object whose id is a URL
  specSection: VC Data Model 2.0 §4.7
  failIfMatched: true
  expression: |
    _credentials()[? !_isUrl(credential.issuer) && !(type(credential.issuer) == "object" && _isUrl(credential.issuer.id))].label
  reportText:
    'true':
      en: Every credential names a URL issuer
    'false':
      en: 'Credentials without a URL issuer: {{matches}}'

- id: vc:credential_subject
  description: credentialSubject is present (for identity claims aggregation, c2pa-rs flattens it into verifiedIdentities)
  specSection: VC Data Model 2.0 §4.8
  failIfMatched: true
  expression: |
    _credentials()[? credential.credentialSubject == null && credential.verifiedIdentities == null].label
  reportText:
    'true':
      en: Every credential has a credentialSubject
    'false':
      en: 'Credentials without a credentialSubject: {{matches}}'

- id: vc:valid_from_format
  description: validFrom, when present, is an XML Schema dateTimeStamp (date, time and time zone)
  specSection: VC Data Model 2.0 §4.9
  failIfMatched: true
  expression: |
    _credentials()[? credential.validFrom != null && !_isDateTimeStamp(credential.validFrom)].label
  reportText:
    'true':
      en: Every validFrom is a dateTimeStamp
    'false':
      en: 'Credentials with a malformed validFrom: {{matches}}'

- id: vc:valid_until_format
  description: validUntil, when present, is an XML Schema dateTimeStamp (date, time and time zone)
  specSection: VC Data Model 2.0 §4.9
  failIfMatched: true
  expression: |
    _credentials()[? credential.validUntil != null && !_isDateTimeStamp(credential.validUntil)].label
  reportText:
    'true':
      en: Every validUntil is a dateTimeStamp
    'false':
      en: 'Credentials with a malformed validUntil: {{matches}}'

- id: vc:validity_period_order
  description: When both are present, validFrom is the same as or earlier than validUntil
  specSection: VC Data Model 2.0 §4.9
  failIfMatched: true
  expression: |
    _credentials()[? _isDateTimeStamp(credential.validFrom) && _isDateTimeStamp(credential.validUntil) &&
      toDate(credential.validFrom) > toDate(credential.validUntil)].label
  reportText:
    'true':
      en: Every validity period runs forward
    'false':
      en: 'Credentials whose validFrom is after validUntil: {{matches}}'

- id: vc:credential_status
  description: Every credentialStatus entry has a type, and its id (when present) is a URL
  specSection: VC Data Model 2.0 §4.10
  failIfMatched: true
  expression: |
    _credentials()[? length(toArray(notNull(credential.credentialStatus, `[]`))[? type == null || (id != null && !_isUrl(id))]) > 0].label
  reportText:
    'true':
      en: Every credentialStatus entry is well formed (or there are none)
    'false':
      en: 'Credentials with a malformed credentialStatus: {{matches}}'

- id: vc:credential_schema
  description: Every credentialSchema entry has a URL id and a type
  specSection: VC Data Model 2.0 §4.11
  failIfMatched: true
  expression: |
    _credentials()[? length(toArray(notNull(credential.credentialSchema, `[]`))[? type == null || !_isUrl(id)]) > 0].label
  reportText:
    'true':
      en: Every credentialSchema entry is well formed (or there are none)
    'false':
      en: 'Credentials with a malformed credentialSchema: {{matches}}'

- id: cawg_vc:profile
  description: An identity claims aggregation or verifiable credential binding credential carries its CAWG type and @context
  specSection: CAWG Identity 1.1/1.2 §8.1.1; Identity 1.3-draft §8.3
  failIfMatched: true
  expression: |
    _credentials()[?
      (sigType == "cawg.identity_claims_aggregation" && !_hasProfile(credential, $ica_type, $ica_context)) ||
      (sigType == "cawg.verifiable_credential_binding" && !_hasProfile(credential, $vcb_type, $vcb_context))
    ].label
  reportText:
    'true':
      en: Every credential carries the CAWG type and @context for its sig_type
    'false':
      en: 'Credentials missing the CAWG type or @context for their sig_type: {{matches}}'

- id: cawg_vc:valid_from_present
  description: validFrom is present (CAWG requires it, though VC 2.0 does not)
  specSection: CAWG Identity 1.1/1.2 §8.1.1.4; Identity 1.3-draft §8.3.5
  failIfMatched: true
  expression: |
    _credentials()[? credential.validFrom == null].label
  reportText:
    'true':
      en: Every credential has a validFrom
    'false':
      en: 'Credentials without a validFrom: {{matches}}'

- id: cawg_vc:verified_identities_present
  description: The credential lists at least one verified identity
  specSection: CAWG Identity 1.1/1.2 §8.1.1; Identity 1.3-draft §8.3.5
  failIfMatched: true
  expression: |
    _credentials()[? type(credential.verifiedIdentities) != "array" || length(_verifiedIdentities(credential)) == 0].label
  reportText:
    'true':
      en: Every credential lists at least one verified identity
    'false':
      en: 'Credentials with no verified identities: {{matches}}'

- id: cawg_vc:verified_identity_fields
  description: Every verified identity has a non-empty type, a provider with a non-empty name, and an RFC 3339 verifiedAt
  specSection: CAWG Identity 1.1/1.2 §8.1.1; Identity 1.3-draft §8.3.5
  failIfMatched: true
  expression: |
    unique(_credentials()[? length(_verifiedIdentities(credential)[?
      type(type) != "string" || length(notNull(type, "")) == 0 ||
      type(provider) != "object" || type(provider.name) != "string" || length(notNull(provider.name, "")) == 0 ||
      !_isDateTimeStamp(verifiedAt)
    ]) > 0].label)
  reportText:
    'true':
      en: Every verified identity has a type, a provider name and a verifiedAt
    'false':
      en: 'Credentials with incomplete verified identities: {{matches}}'

- id: cawg_vc:verified_identity_type_fields
  description: cawg.social_media has a username, cawg.document_verification a name, and cawg.crypto_wallet an address
  specSection: CAWG Identity 1.1/1.2 §8.1.1
  failIfMatched: true
  expression: |
    _credentials()[? length(_verifiedIdentities(credential)[?
      (type == "cawg.social_media" && length(notNull(username, "")) == 0) ||
      (type == "cawg.document_verification" && length(notNull(name, "")) == 0) ||
      (type == "cawg.crypto_wallet" && length(notNull(address, "")) == 0)
    ]) > 0].label
  reportText:
    'true':
      en: Every verified identity has the fields its type requires
    'false':
      en: 'Credentials with verified identities missing a field their type requires: {{matches}}'

- id: cawg_vc:ica_provider_id
  description: In an identity claims aggregation credential, every verified identity's provider has a URI id
  specSection: CAWG Identity 1.1/1.2 §8.1.1
  failIfMatched: true
  expression: |
    _credentials()[? sigType == "cawg.identity_claims_aggregation" &&
      length(_verifiedIdentities(credential)[? !_isUrl(provider.id)]) > 0].label
  reportText:
    'true':
      en: Every identity claims aggregation provider has a URI id
    'false':
      en: 'Identity claims aggregation credentials with a provider lacking a URI id: {{matches}}'
